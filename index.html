<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEKOgames</title>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const head = document.getElementsByTagName('head')[0];
        
        let platformFolder = 'android';
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            console.log("Detected iOS");
            platformFolder = 'iphone';
        }

        const modules = ['main.css', 'menu.css', 'lobby.css', 'game.css'];
        modules.forEach(file => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `css/${platformFolder}/${file}`;
            head.appendChild(link);
        });
    </script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>
                <div class="logo-icon"></div>
                <span>NEKOgames</span>
            </h1>
        </header>
        
        <div id="auth-screen" class="screen">
            <div class="card">
                <h2>Вход</h2>
                <div class="avatar-selection">
                    <div class="avatar-frame">
                        <img id="current-avatar-img" src="assets/avatars/ava1.png" alt="Avatar">
                    </div>
                    <button id="next-avatar-btn" class="refresh-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <input type="text" id="username-input" placeholder="Твой никнейм" autocomplete="off">
                <button id="login-btn">Войти в игру</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <div class="profile-header">
                <div id="user-display"></div>
                <button class="logout-btn" onclick="location.reload()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            
            <button id="create-game-btn" class="action-btn">➕ Создать комнату</button>
            
            <h3>Активные игры:</h3>
            <div id="rooms-list" class="scroll-area">
                <div class="empty-state">Поиск комнат...</div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <button id="leave-game-btn" class="secondary-btn">← Назад</button>
                <span id="room-id-display">Комната #000</span>
            </div>
            <div id="game-board" class="board-area"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
