<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEKOboard</title>
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/chat.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f13">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/loader.js"></script> 
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="toast-container"></div>

    <div id="create-room-modal" class="modal-overlay">
        <div class="modal-window">
            <h3>Создание комнаты</h3>
            
            <input type="text" id="room-name-input" placeholder="Название комнаты" maxlength="20">
            
            <div class="game-selector" style="margin-bottom: 15px; text-align: left;">
                <label style="color: #a0a0a0; font-size: 14px; display: block; margin-bottom: 5px;">Режим игры</label>
                <select id="game-type-select" style="width: 100%; padding: 10px; background: #2d2d35; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; outline: none;">
                    <option value="tictactoe">Tic-Tac-Toe</option>
                    <option value="brawl">BrawlKitty</option>
                    <option value="godot_run">KittyHunt</option>
                </select>
            </div>
            
            <div class="range-wrap">
                <label style="color: #a0a0a0; font-size: 14px;">Количество игроков</label>
                <span id="players-count-display" class="range-value">2</span>
                <input type="range" id="players-range" min="2" max="6" value="2" oninput="document.getElementById('players-count-display').innerText = this.value">
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="main-btn hover-sound" onclick="closeModal()" style="background: #444;">Отмена</button>
                <button class="main-btn hover-sound" onclick="createRoom()">Создать</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="screen">
        <div class="login-wrapper">
            <div class="login-card">
                <h2>NEKOboard</h2>
                <p>Ваша игровая мультивселенная</p>
                
                <div id="avatar-grid" class="avatar-grid"></div>
                <input type="text" id="nickname-input" placeholder="Введите никнейм" maxlength="12">
                
                <button onclick="saveProfile()" class="main-btn hover-sound">
                    <span>Войти</span>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="lobby" class="screen hidden">
        <header>
            <div class="logo">
                <svg class="icon-lg" viewBox="0 0 24 24" stroke="#6c5ce7"><path d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>
                <div>NEKO<span>board</span></div>
            </div>
            
            <div class="header-right">
                <button class="user-profile hover-sound" onclick="logout()" style="border: 1px solid var(--glass-border); background: var(--glass-bg); color: white;">
                    <div class="profile-info">
                        <span id="display-name">Guest</span>
                        <span id="user-status">ONLINE</span>
                    </div>
                    <img id="display-avatar" src="" alt="Avatar">
                </button>
            </div>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active hover-sound" onclick="switchTab('games')" id="tab-games">
                <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4M15 11h.01M18 13h.01"/></svg>
                Игры
            </button>
            <button class="tab-btn hover-sound" onclick="switchTab('servers')" id="tab-servers">
                <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                Сервера
            </button>
        </div>

        <div id="content-games" class="games-grid">
            <button class="game-card hover-sound" onclick="openCreateModal('tictactoe')">
                <div class="game-icon" style="background: linear-gradient(45deg, #a18cd1, #fbc2eb);">
                     <svg class="icon-xl" viewBox="0 0 24 24" stroke="white"><path d="M3 3l18 18M21 3L3 21"/></svg>
                </div>
                <h3>Tic-Tac-Toe</h3>
            </button>
            
            <button class="game-card hover-sound" onclick="openCreateModal('brawl')">
                <div class="game-icon" style="background: linear-gradient(45deg, #ff9a9e, #fad0c4);">
                    <svg class="icon-xl" viewBox="0 0 24 24" stroke="white"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4M15 11h.01M18 13h.01"/></svg>
                </div>
                <h3>BrawlKitty</h3>
            </button>

            <button class="game-card hover-sound" onclick="openCreateModal('godot_run')">
                <div class="game-icon" style="background: linear-gradient(45deg, #4facfe, #00f2fe);">
                     <svg class="icon-xl" viewBox="0 0 24 24" stroke="white"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <h3>KittyHunt</h3>
            </button>

        <div id="content-servers" class="server-list hidden">
            <div style="text-align: center; color: #666; padding: 20px;">Загрузка списка комнат...</div>
        </div>
    </div>

    <div id="floating-chat" class="floating-chat-container hidden">
        <div id="chat-window" class="chat-window">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;"><div class="online-status"></div>Global Chat</div>
                <div style="cursor:pointer;" onclick="toggleChat()"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div style="text-align:center; opacity:0.5; font-size:12px; margin-top:20px;">System: Connected</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Message..." maxlength="50">
                <button onclick="sendMessage()" class="send-btn hover-sound">
                    <svg class="icon-lg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
        <button class="chat-toggle-btn hover-sound" onclick="toggleChat()">
            <svg class="icon-lg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
    </div>

    <div class="floating-sound-container hidden" id="sound-container">
        <button class="sound-toggle-btn hover-sound" id="sound-btn" onclick="toggleMute()">
            <svg class="icon-lg" viewBox="0 0 24 24" stroke="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
    </div>

    <script src="js/main.js"></script>

</body>
</html>
