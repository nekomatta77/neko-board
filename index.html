<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEKOgames</title>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const head = document.getElementsByTagName('head')[0];
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            console.log("Detected iOS");
            link.href = 'css/iphone.css';
        } else {
            console.log("Detected Android/PC");
            link.href = 'css/android.css';
        }
        head.appendChild(link);
    </script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>
                <svg class="cat-logo" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4C9 4 6 6 6 9V14C6 17 9 20 12 20C15 20 18 17 18 14V9C18 6 15 4 12 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6 9L3 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18 9L21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 13C9 13 10 14 12 14C14 14 15 13 15 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 10H10.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 10H14.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>NEKOgames</span>
            </h1>
        </header>
        
        <div id="auth-screen" class="screen">
            <div class="card">
                <h2>Вход</h2>
                <input type="text" id="username-input" placeholder="Твой никнейм" autocomplete="off">
                <button id="login-btn">Войти в игру</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <div class="user-bar">
                <span id="user-display">Игрок</span>
                <button class="small-btn" onclick="location.reload()">Выход</button>
            </div>
            
            <button id="create-game-btn" class="action-btn">➕ Создать комнату</button>
            
            <h3>Список комнат:</h3>
            <div id="rooms-list" class="scroll-area">
                <div class="empty-state">Поиск комнат...</div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <button id="leave-game-btn" class="secondary-btn">← Назад</button>
                <span id="room-id-display">Комната #000</span>
            </div>
            <div id="game-board" class="board-area">
                </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
