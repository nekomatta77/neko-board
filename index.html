<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEKOgames</title>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const head = document.getElementsByTagName('head')[0];
        
        let platformFolder = 'android';
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            console.log("Detected iOS");
            platformFolder = 'iphone';
        }

        const modules = ['main.css', 'menu.css', 'lobby.css', 'game.css', 'chat.css'];
        
        modules.forEach(file => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `css/${platformFolder}/${file}`;
            head.appendChild(link);
        });
    </script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>
                <div class="logo-icon"></div>
                <span>NEKOgames</span>
            </h1>
        </header>
        
        <div id="auth-screen" class="screen">
            <div class="card">
                <h2>Вход</h2>
                <div class="avatar-selection">
                    <button id="prev-avatar-btn" class="nav-btn left">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="avatar-frame">
                        <img id="current-avatar-img" src="assets/avatars/ava1.png" alt="Avatar">
                    </div>
                    <button id="next-avatar-btn" class="nav-btn right">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <input type="text" id="username-input" placeholder="Твой никнейм" autocomplete="off">
                <button id="login-btn">Войти в игру</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen hidden">
            <div class="profile-header">
                <div id="user-display"></div>
                <button class="logout-btn" onclick="location.reload()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            
            <div class="create-zone">
                <div class="select-wrapper">
                    <label>Игроков:</label>
                    <select id="players-count-select">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <button id="create-game-btn" class="action-btn">➕ Создать</button>
            </div>
            
            <h3>Активные игры:</h3>
            <div id="rooms-list" class="scroll-area room-scroll">
                <div class="empty-state">Поиск комнат...</div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <button id="leave-game-btn" class="secondary-btn">Выйти</button>
                <span id="room-id-display">Комната</span>
            </div>
            
            <div class="players-grid" id="players-container"></div>

            <div id="game-selection-area" class="board-area">
                <div class="waiting-text">Ожидание игроков...</div>
            </div>

            <div class="chat-area">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Чат комнаты..." autocomplete="off">
                    <button id="send-chat-btn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notification-container"></div>

    <div id="fullscreen-overlay" class="hidden">
        <div class="fullscreen-header">
            <button id="close-fullscreen-btn" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                   <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <span id="active-game-title">Игра</span>
            <div style="width: 24px;"></div> </div>
        
        <div id="fullscreen-game-mount"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
