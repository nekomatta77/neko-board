<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Game - Neko Board</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/lobby.css">
</head>
<body>

    <div id="game-container">
        </div>

    <div id="ui-layer">
        <div id="health-bars">
            </div>
        
        <div id="mobile-controls">
            <div class="control-group left">
                <div id="joystick-area">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            <div class="control-group right">
                <button id="btn-jump" class="control-btn">⬆️</button>
                <button id="btn-attack" class="control-btn">⚔️</button>
            </div>
        </div>
    </div>

    <div id="orientation-warning">
        <div class="phone-icon"></div>
        <h2>Пожалуйста, переверните устройство</h2>
        <p>Для игры необходим горизонтальный режим</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    
    <script type="module" src="game.js"></script> 
</body>
</html>
