<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEKO Brawl 3D</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/lobby.css">
    
    <script>
        const ua = navigator.userAgent.toLowerCase();
        const head = document.getElementsByTagName('head')[0];
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.type = 'text/css';

        if (ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1) {
            link.href = 'css/iphone.css';
            head.appendChild(link);
            console.log('Applied iPhone styles');
        } else if (ua.indexOf('android') > -1) {
            link.href = 'css/android.css';
            head.appendChild(link);
            console.log('Applied Android styles');
        }
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui-layer"></div>

    <button id="exit-btn" onclick="exitGame()">✕</button>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Загрузка ресурсов...</div>
    </div>

    <div id="joystick-zone"></div>
    <div id="touch-rotate-zone"></div>
    <div id="pc-instructions">WASD - Бег | Мышь - Камера</div>

    <script type="module" src="game.js"></script>
</body>
</html>
